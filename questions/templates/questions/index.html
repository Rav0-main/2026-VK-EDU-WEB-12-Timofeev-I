{% extends 'base.html' %}

{% load static %}
{% block head %}
<link rel="stylesheet" href="{% static 'questions/css/index.css' %}">
{% endblock %}

{% block content %}
<div class="mb-4" style="display: flex;">
  <span style="margin-right: 1.5rem;">
    <h2 class="fw-bold text-info" style="border-left: 5px solid #0dcaf0; padding-left: 1rem;">
      New Questions
    </h2>
  </span>
  <span>
    <a class="link-danger link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover"
    href="{% url 'questions:hot' %}">
      <h2 class="fw-bold text-danger">
        Hot questions
      </h2>
    </a>
  </span>
</div>

{% include 'questions/partials/question_list.html' %}
{% include 'questions/partials/pagination.html' %}
{% endblock %}
