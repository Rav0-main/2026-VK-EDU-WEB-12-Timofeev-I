<ul class="pagination">
  {% if page.has_previous %}
  <li class="page-item"><a class="page-link" href="?page={{ page.previous_page_number }}">Предыдущая</a></li>
  {% else %}
  <li class="page-item disabled"><a class="page-link">Предыдущая</a></li>
  {% endif %}

  <li class="page-item active"><a class="page-link" href="#">{{ page.number }}</a></li>

  {% if page.has_next %}
  <li class="page-item"><a class="page-link" href="?page={{ page.next_page_number }}">Следующая</a></li>
  {% else %}
  <li class="page-item disabled"><a class="page-link">Следующая</a></li>
	{% endif %}
</ul>
