<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            // Does this cookie string begin with the name we want?
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

const CSRF_TOKEN_ANSWER_SET_CORRECT = getCookie('csrftoken');
const BASE_URL_ANSWER_SET_CORRECT = "{% url 'questions:answer_set_correct' answer_id=0 %}"

async function send_answer_set_correct(id) {
    try {
        const url = BASE_URL_ANSWER_SET_CORRECT.replace("0", id)
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': CSRF_TOKEN_ANSWER_SET_CORRECT
            },
        });

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        window.location.reload();
    } catch (error) {
        console.error('Ошибка при отправке запроса:', error);
    }
}

function handle_set_correct_click(event) {
    const button = event.currentTarget;
    const id = parseInt(button.dataset.answer);
    
    send_answer_set_correct(id);
}

const set_correct_buttons = document.querySelectorAll('.set-correct-btn');

set_correct_buttons.forEach(button => {
    button.addEventListener('click', handle_set_correct_click);
});
</script>
