{% extends 'base.html' %}

{% load static %}
{% block head %}
<link rel="stylesheet" href="{% static 'css/prompt-primary.css' %}">
{% endblock %}

{% block content %}
<div class="mb-4">
  <h2 class="fw-bold text-info" style="border-left: 5px solid #0dcaf0; padding-left: 1rem;">
    Settings: {{ user.profile.nickname }}
  </h2>
</div>

<div class="mb-4" style="padding-right: 1.5rem;">
  <div class="input-group">
    <span class="input-group-text prompt-primary">Login: </span>
    <textarea class="form-control" placeholder="Type login...">{{ user.username }}</textarea>
  </div>
</div>

<div class="mb-4" style="padding-right: 1.5rem;">
  <div class="input-group">
    <span class="input-group-text prompt-primary">Email: </span>
    <textarea class="form-control" placeholder="Type email">{{ user.email }}</textarea>
  </div>
</div>

<div class="mb-4" style="padding-right: 1.5rem;">
  <div class="input-group">
    <span class="input-group-text prompt-primary">NickName: </span>
    <textarea class="form-control" placeholder="Type nickname">{{ user.profile.nickname }}</textarea>
  </div>
</div>

<div class="mb-4 d-flex" style="padding-right: 1.5rem;">
  <span style="font-size: large; font-weight: 500; margin-right: 0.7rem;">
    Avatar:
  </span>
  <img src="#"
    style="max-width: 200px; height: auto; border-radius: 12px; border: 0.1rem solid #000000; padding: 0.2rem;">
</div>

<div class="input-group mb-3" style="padding-right: 1.5rem; max-width: 500px;">
  <span style="font-size: large; font-weight: 500; padding-right: 0.7rem; align-self: center;">
    New avatar:
  </span>
  <input type="file" class="form-control" accept="image/*">
</div>

<div style="margin: 0.7rem 0; text-align: left;">
  <button class="btn btn-primary btn-lg" style="width: 7rem;">Save</button>
</div>
{% endblock %}
