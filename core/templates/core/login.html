{% extends 'base.html' %}

{% load static %}
{% block head %}
<link rel="stylesheet" href="{% static 'css/prompt-primary' %}">
{% endblock %}

{% block content %}
<div class="mb-4">
  <h2 class="fw-bold text-info" style="border-left: 5px solid #0dcaf0; padding-left: 1rem;">
    Log In
  </h2>
</div>

<div class="mb-3">
  <h5 class="text-danger">
    Sorry, wrong password!
  </h5>
</div>

<div class="mb-3" style="padding-right: 1.5rem;">
  <div class="input-group input-group-lg">
    <span class="input-group-text prompt-primary">Login: </span>
    <textarea class="form-control" placeholder="Type login..."></textarea>
  </div>
</div>

<div class="mb-3" style="padding-right: 1.5rem;">
  <div class="input-group input-group-lg">
    <span class="input-group-text prompt-primary">Password: </span>
    <textarea class="form-control" placeholder="Type password..."></textarea>
  </div>
</div>

<div class="mb-4" style="margin: 0.7rem 0; text-align: left;">
  <button class="btn btn-primary btn-lg">Log In</button>
</div>

<div style="margin: 0.7rem 0; text-align: left;">
  <a href="{% url 'core:register' %}">
    <button class="btn btn-secondary btn-lg">Create new account</button>
  </a>
</div>
{% endblock %}
