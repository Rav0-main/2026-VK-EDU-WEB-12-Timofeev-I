{% extends 'base.html' %}

{% load static %}
{% block head %}
<link rel="stylesheet" href="{% static 'css/prompt-primary.css' %}">
{% endblock %}

{% block content %}
<div class="mb-4">
  <h2 class="fw-bold text-info" style="border-left: 5px solid #0dcaf0; padding-left: 1rem;">
    Log In
  </h2>
</div>

<div class="mb-3">
  <h5 class="text-danger">
    Sorry, wrong password!
  </h5>
</div>

<form class="mb-4" style="margin-right: 1.0rem; max-width: 500px;">
  <div class="form-group mb-3">
    <div class="input-group">
      <span class="input-group-text prompt-primary" style="height: 3.3rem">Login: </span>
        <input type="email" class="form-control" placeholder="Type login..." style="height: 3.3rem;">
    </div>
  </div>
  <div class="form-group mb-3">
    <div class="input-group">
      <span class="input-group-text prompt-primary" style="height: 3.3rem">Password: </span>
      <input type="password" class="form-control" placeholder="Type password..." style="height: 3.3rem;">
    </div>
  </div>
  <button type="submit" class="btn btn-primary btn-lg">Log In</button>
</form>

<div style="margin: 0.7rem 0; text-align: left;">
  <a href="{% url 'core:register' %}">
    <button class="btn btn-secondary btn-lg">Create new account</button>
  </a>
</div>
{% endblock %}
