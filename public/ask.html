<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Базовое содержимое всех страниц">

  <title>WHAT && WHY && HOW</title>
  <link rel="icon" type="image/x-icon" href="./static/img/favicon.ico">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous">
  
  <link href="./static/css/base.css" rel="stylesheet">
  <link href="./static/css/ask.css" rel="stylesheet">
  <link href="./static/css/question.css" rel="stylesheet">
</head>

<body>
  <div class="header">
    <div class="d-flex align-items-center p-3 flex-wrap justify-content-between" style="max-width: 1400px; margin: 0 auto;">
      <div class="d-flex align-items-center flex-grow-1">
        <div class="flex-shrink-0">
          <a href="./index.html">
            <img src="./static/img/question.png" 
              class="img-fluid"
              style="width: 80px; height: auto;">
          </a>
        </div>

        <div class="input-group ms-3" style="width: 40%; min-width: 280px;">
          <input type="text" class="form-control border-primary-subtle bg-light"
            placeholder="Type question..." aria-label="Question" style="border-width: 2px;">
          <button class="btn btn-success" type="button">
            Search
          </button>
        </div>

        <div class="d-flex ms-3">
          <a href="./ask.html">
            <button class="btn btn-info btn-md px-4">
              Ask
            </button>
          </a>
        </div>
      </div>

      <div class="d-flex gap-2 mt-2 mt-sm-0" style="align-items: flex-start;">
        <div class="user-avatar" style="margin-right: 0.5rem;">
          <img class="img-fluid user-avatar" src="./static/img/third_avatar.png">
        </div>
        <div style="flex: 1;">
          <h5 class="mb-3">
            UserName
          </h5>
          <div class="d-flex gap-2">
            <a href="./settings.html">
              <button class="btn btn-secondary btn-sm">
                Settings
              </button>
            </a>
            <button class="btn btn-danger btn-sm">
              Log Out
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="main-content" style="width: 95%;">
      <div class="mb-4">
        <h2 class="fw-bold text-info" style="border-left: 5px solid #0dcaf0; padding-left: 1rem;">
          New Question
        </h2>
      </div>
  
      <div class="mb-3" style="padding-right: 1.5rem;">
        <div class="input-group input-group-lg">
          <span class="input-group-text prompt-primary">Title: </span>
          <textarea class="form-control" placeholder="Type title..."></textarea>
        </div>
      </div>

      <div class="mb-3" style="padding-right: 1.5rem;">
        <div class="input-group input-group-lg">
          <span class="input-group-text prompt-primary">Question: </span>
          <textarea class="form-control" placeholder="Type question..." style="height: 12rem;"></textarea>
        </div>
      </div>

      <div class="mb-4" style="padding-right: 1.5rem;">
        <div class="input-group input-group-lg">
          <span class="input-group-text prompt-primary">Tags: </span>
          <textarea class="form-control" placeholder="Type tag(s)..."></textarea>
        </div>
      </div>

      <div style="margin-right: 1.5rem; display: flex; justify-content: flex-end;">
        <button class="btn btn-primary btn-lg" style="width: 6rem;">
          Ask
        </button>
      </div>
    </div>

    <div class="sidebar">
      <div class="popular-tags">
        <div class="text-center mb-3">
          <h2 class="section-title">Popular tags</h2>
        </div>
        <div class="popular-tags-content">
          <span class="popular-tag" style="color: #ff8c00; font-size: 1.2rem;">Python</span>
          <span class="popular-tag" style="color: #ce5c00; font-size: 1.1rem;">Rust</span>
          <span class="popular-tag" style="color: #2c3e50; font-size: 1rem;">C++</span>
          <span class="popular-tag" style="color: #17a2b8; font-size: 0.95rem;">Math</span>
          <span class="popular-tag" style="color: #dc3545; font-size: 1rem;">Linux</span>
          <span class="popular-tag" style="color: #20c997; font-size: 0.9rem;">Django</span>
          <span class="popular-tag" style="color: #fd7e14; font-size: 1rem;">Go</span>
        </div>
      </div>

      <div class="best-members">
        <div class="text-center mb-3">
          <h2 class="section-title" style="border-bottom-color: #0d6efd;">Best members</h2>
        </div>
        <div>
          <div class="member">
            <a class="link-primary link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" href="#">
              <h5 class="mb-1">
                Petrov Ivan
              </h5>
            </a>
          </div>
          <div class="member">
            <a class="link-danger link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" href="#">
              <h5 class="mb-1">
                Соболев Игнат
              </h5>
            </a>
          </div>
          <div class="member">
            <a class="link-secondary link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" href="#">
              <h5 class="mb-1">
                Федотов Максим
              </h5>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      <h2>WHAT && WHY && HOW</h2>
      <hr>
      <p>Интересна та или иная тема? Задай вопрос или найди уже готовый ответ.</p>
    </div>
  </div>

</body>
</html>
