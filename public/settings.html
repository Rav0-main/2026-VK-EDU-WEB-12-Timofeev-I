<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>WHAT && WHY && HOW</title>
  <link rel="icon" type="image/x-icon" href="./static/img/favicon.ico">

  <link rel="stylesheet" href="./static/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="./static/css/base.css">
  <link rel="stylesheet" href="./static/css/question.css">
  <link rel="stylesheet" href="./static/css/ask.css">
</head>

<body>
  <div class="header">
    <div class="d-flex align-items-center p-3 flex-wrap justify-content-between" style="max-width: 1400px; margin: 0 auto;">
      <div class="d-flex align-items-center flex-grow-1">
        <div class="flex-shrink-0">
          <a href="./index.html">
            <img src="./static/img/question.png" 
              class="img-fluid"
              style="width: 80px; height: auto;">
          </a>
        </div>

        <div class="input-group ms-3" style="width: 40%; min-width: 280px;">
          <input type="text" class="form-control border-primary-subtle bg-light"
            placeholder="Type question..." aria-label="Question" style="border-width: 2px;">
          <button class="btn btn-success" type="button">
            Search
          </button>
        </div>

        <div class="d-flex ms-3">
          <a href="./ask.html">
            <button class="btn btn-info btn-md px-4">
              Ask
            </button>
          </a>
        </div>
      </div>

      <div class="d-flex gap-2 mt-2 mt-sm-0" style="align-items: flex-start;">
        <div class="user-avatar" style="margin-right: 0.5rem;">
          <img class="img-fluid user-avatar" src="./static/img/third_avatar.png">
        </div>
        <div style="flex: 1;">
          <h5 class="mb-3">
            NickName
          </h5>
          <div class="d-flex gap-2">
            <a href="./settings.html">
              <button class="btn btn-secondary btn-sm">
                Settings
              </button>
            </a>
            <button class="btn btn-danger btn-sm">
              Log Out
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="main-content">
        <div class="mb-4">
          <h2 class="fw-bold text-info" style="border-left: 5px solid #0dcaf0; padding-left: 1rem;">
            Settings: NickName
          </h2>
        </div>

        <div class="mb-4" style="padding-right: 1.5rem;">
          <div class="input-group">
            <span class="input-group-text prompt-primary">Login: </span>
            <textarea class="form-control" placeholder="PREVIOUS_LOGIN"></textarea>
          </div>
        </div>

        <div class="mb-4" style="padding-right: 1.5rem;">
          <div class="input-group">
            <span class="input-group-text prompt-primary">Email: </span>
            <textarea class="form-control" placeholder="PREVIOUS_EMAIL"></textarea>
          </div>
        </div>

        <div class="mb-4" style="padding-right: 1.5rem;">
          <div class="input-group">
            <span class="input-group-text prompt-primary">NickName: </span>
            <textarea class="form-control" placeholder="PREVIOUS_NICK_NAME"></textarea>
          </div>
        </div>

        <div class="mb-4 d-flex" style="padding-right: 1.5rem;">
          <span style="font-size: large; font-weight: 500; margin-right: 0.7rem;">
            Previous avatar:
          </span>
          <img src="./static/img/first_avatar.jpg"
            style="max-width: 200px; height: auto; border-radius: 12px; border: 0.1rem solid #000000; padding: 0.2rem;">
        </div>

        <div class="input-group mb-5" style="padding-right: 1.5rem; max-width: 500px;">
          <span style="font-size: large; font-weight: 500; padding-right: 0.7rem; align-self: center;">
            New avatar:
          </span>
          <input type="file" class="form-control" accept="image/*">
        </div>

        <div style="margin: 0.7rem 0; text-align: left;">
          <button class="btn btn-primary btn-lg" style="width: 7rem;">Save</button>
        </div>
      
    </div>

    <div class="sidebar">
      <div class="popular-tags">
        <div class="text-center mb-3">
          <h2 class="section-title">Popular tags</h2>
        </div>
        <div class="popular-tags-content">
          <span class="popular-tag" style="color: #ff8c00; font-size: 1.2rem;">Python</span>
          <span class="popular-tag" style="color: #ce5c00; font-size: 1.1rem;">Rust</span>
          <span class="popular-tag" style="color: #2c3e50; font-size: 1rem;">C++</span>
          <span class="popular-tag" style="color: #17a2b8; font-size: 0.95rem;">Math</span>
          <span class="popular-tag" style="color: #dc3545; font-size: 1rem;">Linux</span>
          <span class="popular-tag" style="color: #20c997; font-size: 0.9rem;">Django</span>
          <span class="popular-tag" style="color: #fd7e14; font-size: 1rem;">Go</span>
        </div>
      </div>

      <div class="best-members">
        <div class="text-center mb-3">
          <h2 class="section-title" style="border-bottom-color: #0d6efd;">Best members</h2>
        </div>
        <div>
          <div class="member">
            <a class="link-primary link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" href="#">
              <h5 class="mb-1">
                Petrov Ivan
              </h5>
            </a>
          </div>
          <div class="member">
            <a class="link-danger link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" href="#">
              <h5 class="mb-1">
                Соболев Игнат
              </h5>
            </a>
          </div>
          <div class="member">
            <a class="link-secondary link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" href="#">
              <h5 class="mb-1">
                Федотов Максим
              </h5>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      <h2>WHAT && WHY && HOW</h2>
      <hr>
      <p>Интересна та или иная тема? Задай вопрос или найди уже готовый ответ.</p>
    </div>
  </div>

</body>
</html>
